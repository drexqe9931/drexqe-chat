<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexqe Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .input-area { display: flex; padding: 10px; background: #1f1f1f; gap: 5px; }
    input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: none; outline: none; }
    button { padding: 10px 15px; border-radius: 5px; border: none; background: #6200ee; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <div id="chat-box"></div>

  <div class="input-area">
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(this)">
    <button type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
    <input type="text" id="msgInput" placeholder="Type an encrypted message...">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const socket = io();

    async function handleMediaUpload(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert("File too large! Please choose a file under 5MB.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target.result;
        const payload = JSON.stringify({
          type: file.type.startsWith('video') ? 'video' : 'image',
          data: base64Data
        });

        socket.emit("chat-message", { payload });
      };
      reader.readAsDataURL(file);
    }

    socket.on("chat-message", (data) => {
      const chatBox = document.getElementById("chat-box");
      try {
        const parsed = JSON.parse(data.payload);
        if (parsed.type === 'image') {
          const img = document.createElement("img");
          img.src = parsed.data;
          img.style.maxWidth = "200px";
          img.style.borderRadius = "8px";
          chatBox.appendChild(img);
        } else if (parsed.type === 'video') {
          const video = document.createElement("video");
          video.src = parsed.data;
          video.controls = true;
          video.style.maxWidth = "240px";
          chatBox.appendChild(video);
        }
      } catch (e) {
        const msgDiv = document.createElement("div");
        msgDiv.textContent = data.payload;
        chatBox.appendChild(msgDiv);
      }
    });

    function sendMessage() {
      const input = document.getElementById("msgInput");
      if (!input.value.trim()) return;
      socket.emit("chat-message", { payload: input.value });
      input.value = "";
    }
  </script>
</body>
</html>
