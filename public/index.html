<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drexqe Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: #0d0e15; color: #00f0ff; }
    
    /* Login Screen */
    #auth-screen { position: fixed; inset: 0; background: #08090d; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .auth-card { background: #12141d; padding: 24px; border-radius: 12px; border: 1px solid #7000ff; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(112,0,255,0.3); }
    .auth-card h2 { color: #00f0ff; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    .auth-card input, .auth-card select { width: 100%; padding: 12px; background: #08090d; border: 1px solid #7000ff; border-radius: 8px; color: #00f0ff; font-size: 14px; outline: none; }
    .auth-card button { padding: 12px; background: linear-gradient(135deg, #7000ff, #00f0ff); border: none; border-radius: 8px; color: #0d0e15; font-weight: bold; cursor: pointer; font-size: 15px; }

    /* App Screen */
    #app-screen { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
    header { background-color: #12141d; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #7000ff; flex-shrink: 0; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #7000ff; border: 1px solid #00f0ff; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #00f0ff; }
    .header-info h2 { font-size: 16px; color: #00f0ff; }
    .header-info p { font-size: 12px; color: #7000ff; }

    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background-color: #08090d; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; word-wrap: break-word; }
    .received { background-color: #161925; color: #e0e6ed; border-left: 3px solid #7000ff; align-self: flex-start; }
    .sent { background-color: #1a0b2e; color: #00f0ff; border-right: 3px solid #00f0ff; align-self: flex-end; }
    .system { align-self: center; background-color: #12141d; color: #7000ff; border: 1px solid #7000ff; font-size: 12px; padding: 4px 10px; border-radius: 6px; }

    .input-area { display: flex; align-items: center; padding: 10px; background-color: #12141d; gap: 8px; border-top: 1px solid #7000ff; flex-shrink: 0; }
    .input-area input[type="text"] { flex: 1; background-color: #08090d; border: 1px solid #7000ff; padding: 12px 16px; border-radius: 20px; color: #00f0ff; font-size: 14px; outline: none; }
    .btn-icon { background: none; border: none; color: #7000ff; font-size: 22px; cursor: pointer; padding: 4px; }
    .btn-send { background: linear-gradient(135deg, #7000ff, #00f0ff); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0d0e15; font-weight: bold; flex-shrink: 0; }
    img, video { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>Drexqe Cybernet</h2>
      <input type="text" id="roomIdInput" placeholder="Room ID" value="01112011">
      <input type="text" id="usernameInput" placeholder="User Identifier">
      <select id="roleSelect" onchange="toggleSecretInput(this.value)">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <input type="password" id="passkeyInput" placeholder="Member Passkey (9460)">
      <input type="password" id="secretKeyInput" placeholder="Admin Secret Key" style="display: none;">
      <button onclick="joinRoom()">Connect</button>
    </div>
  </div>

  <!-- Main Screen -->
  <div id="app-screen" style="display: none;">
    <header>
      <div class="avatar">⚡</div>
      <div class="header-info">
        <h2 id="roomTitle">Drexqe</h2>
        <p id="userRoleStatus">E2EE Encrypted Node</p>
      </div>
    </header>

    <div id="chat-box">
      <div class="system">Encrypted session initialized.</div>
    </div>

    <div class="input-area">
      <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(this)">
      <button class="btn-icon" type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
      <input type="text" id="msgInput" placeholder="Transmit encrypted packet..." onkeypress="if(event.key==='Enter') sendTextMessage()">
      <button class="btn-send" onclick="sendTextMessage()">➤</button>
    </div>
  </div>

  <script>
    const socket = io();
    let cryptoKey = null;
    let currentUser = "";
    let currentRoom = "";

    function toggleSecretInput(role) {
      document.getElementById("secretKeyInput").style.display = role === "admin" ? "block" : "none";
    }

    async function deriveKey(secret) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(secret), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("drexqe-salt"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv }, cryptoKey, enc.encode(text)
      );
      return JSON.stringify({
        iv: Array.from(iv),
        ciphertext: Array.from(new Uint8Array(encrypted))
      });
    }

    async function decryptData(jsonStr) {
      try {
        const { iv, ciphertext } = JSON.parse(jsonStr);
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(iv) },
          cryptoKey,
          new Uint8Array(ciphertext)
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return jsonStr;
      }
    }

    async function joinRoom() {
      const room = document.getElementById("roomIdInput").value.trim();
      const name = document.getElementById("usernameInput").value.trim();
      const role = document.getElementById("roleSelect").value;
      const pass = document.getElementById("passkeyInput").value.trim();
      const secret = document.getElementById("secretKeyInput").value.trim();

      if (!room || !name || !pass) return alert("All fields are required");
      if (role === "admin" && secret !== "M4nil@l019") return alert("Invalid Secret Key");
      if (pass !== "9460") return alert("Invalid Member Passkey");

      currentUser = name;
      currentRoom = room;
      cryptoKey = await deriveKey(pass + room);

      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "flex";
      document.getElementById("roomTitle").textContent = `Room: ${room}`;
      document.getElementById("userRoleStatus").textContent = `${name} [${role.toUpperCase()}]`;

      socket.emit("join-room", { room, user: name });
    }

    async function sendTextMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const payload = await encryptData(JSON.stringify({ type: 'text', sender: currentUser, body: text }));
      socket.emit("chat-message", { room: currentRoom, payload });
      appendMessage({ type: 'text', sender: currentUser, body: text }, true);
      input.value = "";
    }

    async function handleMediaUpload(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) return alert("File too large! Max size 5MB.");

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target.result;
        const msgObj = {
          type: file.type.startsWith('video') ? 'video' : 'image',
          sender: currentUser,
          body: base64Data
        };
        const payload = await encryptData(JSON.stringify(msgObj));
        socket.emit("chat-message", { room: currentRoom, payload });
        appendMessage(msgObj, true);
      };
      reader.readAsDataURL(file);
    }

    socket.on("chat-message", async (data) => {
      const decryptedStr = await decryptData(data.payload);
      try {
        const parsed = JSON.parse(decryptedStr);
        if (parsed.sender !== currentUser) {
          appendMessage(parsed, false);
        }
      } catch(e) {}
    });

    function appendMessage(msgObj, isSent) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${isSent ? 'sent' : 'received'}`;

      if (msgObj.type === 'text') {
        msgDiv.textContent = isSent ? msgObj.body : `${msgObj.sender}: ${msgObj.body}`;
      } else if (msgObj.type === 'image') {
        const img = document.createElement("img");
        img.src = msgObj.body;
        msgDiv.appendChild(img);
      } else if (msgObj.type === 'video') {
        const video = document.createElement("video");
        video.src = msgObj.body;
        video.controls = true;
        msgDiv.appendChild(video);
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
