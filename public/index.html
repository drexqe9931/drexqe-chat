<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexqe Group Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #111b21; color: #e9edef; display: flex; align-items: center; justify-content: center; height: 100vh; }
    
    /* Login Modal */
    #login-modal { background: #1f2c34; padding: 25px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; }
    #login-modal h2 { margin-bottom: 20px; font-size: 20px; }
    .input-group { margin-bottom: 15px; position: relative; }
    .input-group input, .input-group select { width: 100%; padding: 12px; background: #2a3942; border: 1px solid #3b4a54; color: #fff; border-radius: 8px; outline: none; font-size: 15px; }
    .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 18px; }
    button.btn-join { width: 100%; padding: 12px; background: #00a884; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button.btn-join:hover { background: #008f70; }

    /* Chat Area */
    #chat-container { display: none; width: 100vw; height: 100vh; flex-direction: column; background: #0b141a; }
    #chat-header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #202c33; padding: 8px 12px; border-radius: 8px; max-width: 75%; width: fit-content; word-break: break-word; }
    .msg.system { background: transparent; color: #8696a0; font-size: 12px; align-self: center; text-align: center; }
    #chat-input-area { background: #202c33; padding: 10px; display: flex; gap: 10px; }
    #chat-input-area input { flex: 1; padding: 10px; background: #2a3942; border: none; color: #fff; border-radius: 8px; outline: none; }
    #chat-input-area button { padding: 10px 15px; background: #00a884; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="login-modal">
    <h2>Join Chat</h2>
    <div class="input-group">
      <input type="text" id="username" placeholder="Username" autocomplete="off" />
    </div>
    <div class="input-group">
      <select id="role">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="input-group">
      <input type="password" id="passkey" placeholder="Passkey" />
      <span class="eye-icon" id="togglePasskey">👁️</span>
    </div>
    <button class="btn-join" id="joinBtn">Join Room</button>
  </div>

  <!-- Chat Container -->
  <div id="chat-container">
    <div id="chat-header">
      <div>
        <h3 id="room-title">Drexqe Group</h3>
        <small id="user-info" style="color: #8696a0;"></small>
      </div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const socket = io();

    // Eye icon toggle logic
    const passkeyInput = document.getElementById('passkey');
    const togglePasskey = document.getElementById('togglePasskey');

    togglePasskey.addEventListener('click', () => {
      const type = passkeyInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passkeyInput.setAttribute('type', type);
    });

    // Device fingerprint generator
    let deviceId = localStorage.getItem('chat_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem('chat_device_id', deviceId);
    }

    let currentRoom = 'main-room';
    let currentUser = '';
    let currentRole = 'member';

    // Join Room logic
    document.getElementById('joinBtn').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      const role = document.getElementById('role').value;
      const passkey = document.getElementById('passkey').value.trim();

      if (!username || !passkey) {
        alert('Please enter both username and passkey.');
        return;
      }

      currentUser = username;
      currentRole = role;

      socket.emit('join-room', {
        room: currentRoom,
        user: username,
        role: role,
        passkey: passkey,
        deviceId: deviceId
      });
    });

    // Socket Response Handlers
    socket.on('auth-success', () => {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('chat-container').style.display = 'flex';
      document.getElementById('user-info').innerText = `${currentUser} (${currentRole})`;
    });

    socket.on('auth-error', (msg) => {
      alert(msg);
    });

    socket.on('user-banned', (msg) => {
      alert(msg);
      location.reload();
    });

    socket.on('chat-history', (history) => {
      const messagesContainer = document.getElementById('chat-messages');
      messagesContainer.innerHTML = '';
      history.forEach(renderMessage);
    });

    socket.on('chat-message', (msg) => {
      renderMessage(msg);
    });

    function renderMessage(msg) {
      const messagesContainer = document.getElementById('chat-messages');
      const div = document.createElement('div');

      if (msg.type === 'system') {
        div.className = 'msg system';
        div.innerText = msg.payload.text;
      } else {
        div.className = 'msg';
        div.innerText = `${msg.payload.text}`;
      }

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Send Message logic
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat-message', {
        room: currentRoom,
        type: 'text',
        payload: { text: text },
        deviceId: deviceId
      });

      input.value = '';
    }
  </script>
</body>
</html>
