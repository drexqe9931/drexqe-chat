<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Drexqe Group Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; height: 100dvh; width: 100vw; overflow: hidden; background-color: #0b141a; color: #e9edef; }
    
    #app-container { display: flex; flex-direction: column; height: 100%; height: 100dvh; width: 100vw; position: relative; }

    .header { background: #202c33; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; height: 60px; min-height: 60px; border-bottom: 1px solid #2a3942; z-index: 10; flex-shrink: 0; }
    .header-left { display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
    .header-info h2 { font-size: 16px; color: #e9edef; font-weight: 600; }
    .header-info p { font-size: 11px; color: #8696a0; }
    .header-actions { display: flex; gap: 8px; }

    .btn { background: #00a884; color: #111b21; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: transform 0.12s, background-color 0.15s; }
    .btn:hover { background: #00c69b; }
    .btn:active { transform: scale(0.92); }
    .btn-danger { background: #ea0038; color: #fff; }
    .btn-danger:hover { background: #ff1a4f; }

    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0b141a; }

    .msg-row { display: flex; margin-bottom: 2px; }
    .msg-row.me { justify-content: flex-end; }
    .msg-row.other { justify-content: flex-start; }
    .msg-row.system-row { justify-content: center; margin: 8px 0; }

    .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14px; position: relative; word-wrap: break-word; }
    .msg.other { background: #202c33; color: #e9edef; border-bottom-left-radius: 2px; }
    .msg.me { background: #005c4b; color: #e9edef; border-bottom-right-radius: 2px; }
    .msg.system { background: #182229; color: #00a884; font-size: 12px; border-radius: 6px; padding: 6px 12px; text-align: center; border: 1px solid rgba(0, 168, 132, 0.2); }
    
    .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; color: #8696a0; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; opacity: 0.7; color: #8696a0; }
    
    .media-container { position: relative; display: inline-block; margin-top: 4px; }
    .chat-image { max-width: 100%; max-height: 250px; border-radius: 8px; cursor: pointer; display: block; object-fit: cover; }
    .img-download-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(11, 20, 26, 0.8); color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 11px; text-decoration: none; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
    
    .bottom-controls { background: #202c33; border-top: 1px solid #2a3942; width: 100%; z-index: 10; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
    .input-bar { padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 56px; }
    .input-bar input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 10px 14px; border-radius: 20px; color: #e9edef; font-size: 14px; outline: none; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #8696a0; display: flex; align-items: center; justify-content: center; }

    /* Voice Call Grid Screen */
    .wa-call-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #111b21; display: flex; flex-direction: column; justify-content: space-between; z-index: 2000; }
    .wa-call-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; color: #8696a0; font-size: 12px; background: rgba(0,0,0,0.2); }
    .wa-call-header .e2e-tag { display: flex; align-items: center; gap: 6px; color: #00a884; font-weight: 600; }

    .wa-call-grid { flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; align-content: center; overflow-y: auto; }
    .wa-call-tile { background: #1f2c34; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 2px solid #2a3942; min-height: 150px; }
    .wa-call-tile.speaking { border-color: #00a884; box-shadow: 0 0 15px rgba(0, 168, 132, 0.3); }
    .wa-tile-name { font-size: 13px; font-weight: 600; color: #e9edef; margin-top: 6px; text-align: center; }
    
    .waveform { display: flex; align-items: center; gap: 4px; height: 18px; margin-top: 8px; margin-bottom: 2px; }
    .waveform span { width: 3px; height: 100%; background: #00a884; border-radius: 3px; animation: bounce 0.8s infinite ease-in-out alternate; }
    .waveform span:nth-child(2) { animation-delay: 0.2s; }
    .waveform span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0% { height: 4px; } 100% { height: 18px; } }

    .wa-call-dock { background: #202c33; padding: 18px 24px calc(20px + env(safe-area-inset-bottom)); border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; justify-content: center; align-items: center; gap: 24px; border-top: 1px solid #2a3942; }
    .wa-dock-btn { width: 54px; height: 54px; border-radius: 50%; border: none; background: #2a3942; color: #e9edef; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .wa-dock-btn.active { background: #ea0038; color: #fff; }
    .wa-dock-btn.end-call { background: #ea0038; color: #fff; width: 60px; height: 60px; font-size: 22px; }
    .wa-dock-btn.end-call svg { width: 26px; height: 26px; fill: currentColor; }

    .modal-overlay { position: fixed; top:0; left:0; width:100vw; height:100dvh; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2500; }
    .modal-card { background: #222e35; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
    .modal-card input, .modal-card select { background: #2a3942; border: 1px solid #3b4a54; padding: 10px; border-radius: 8px; color: #e9edef; outline: none; font-size: 14px; width: 100%; }
  </style>
</head>
<body>

  <div id="app-container">
    <div class="header">
      <div class="header-left">
        <div class="header-info">
          <h2>Drexqe Group</h2>
          <p id="userInfoSub">🔒 Tap here for group info</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="startGroupCall()">📞 Group Call</button>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="bottom-controls">
      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <h3 style="text-align:center;">Join Chat</h3>
      <input type="text" id="usernameInput" placeholder="Enter Username" autocomplete="off">
      <select id="roleSelect">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <input type="password" id="passkeyInput" placeholder="Enter Passkey">
      <button class="btn" onclick="joinChat()">Join Room</button>
    </div>
  </div>

  <div class="wa-call-screen" id="callScreen" style="display:none;">
    <div class="wa-call-header">
      <div class="e2e-tag">🔒 End-to-End Encrypted Call</div>
      <div id="callTimer">00:00</div>
    </div>

    <div class="wa-call-grid" id="callGrid"></div>

    <div class="wa-call-dock">
      <button class="wa-dock-btn" id="speakerBtn" onclick="toggleSpeaker()">🔊</button>
      <button class="wa-dock-btn" id="muteBtn" onclick="toggleMute()">🎤</button>
      <button class="wa-dock-btn end-call" onclick="leaveGroupCall()">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
      </button>
    </div>
  </div>

  <!-- Dynamic Container for Remote Audio Streams -->
  <div id="remoteAudioContainer" style="display:none;"></div>

  <script>
    const socket = io();

    let currentUser = '';
    let currentRole = 'member';
    let localStream = null;
    let peerConnections = {}; // socketId -> RTCPeerConnection instance
    let isMuted = false;
    let isSpeakerOn = true;
    let callTimerInterval = null;
    let callSeconds = 0;

    // WebRTC STUN/TURN Configuration (OpenRelay for Mobile/Cellular Networks)
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:openrelay.metered.ca:80' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    function joinChat() {
      const user = document.getElementById('usernameInput').value.trim();
      const role = document.getElementById('roleSelect').value;
      const passkey = document.getElementById('passkeyInput').value.trim();

      if (!user || !passkey) return alert('Fill in all fields.');

      currentUser = user;
      currentRole = role;

      socket.emit('join-room', {
        room: 'main-room',
        user: user,
        role: role,
        passkey: passkey,
        deviceId: 'dev_' + Math.random().toString(36).substring(2, 9)
      });
    }

    socket.on('auth-success', () => {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('userInfoSub').innerText = `${currentUser} (${currentRole}) • Active`;
    });

    socket.on('auth-error', (msg) => alert(msg));
    socket.on('chat-history', (history) => {
      document.getElementById('chatBox').innerHTML = '';
      history.forEach(renderMessage);
    });

    socket.on('chat-message', renderMessage);

    function renderMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const row = document.createElement('div');

      if (msg.type === 'system') {
        row.className = 'msg-row system-row';
        row.innerHTML = `<div class="msg system">${msg.payload.text}</div>`;
      } else {
        const isMe = msg.payload.user === currentUser;
        row.className = `msg-row ${isMe ? 'me' : 'other'}`;
        row.innerHTML = `
          <div class="msg ${isMe ? 'me' : 'other'}">
            <div class="msg-header"><span>${msg.payload.user}</span></div>
            <div>${msg.payload.text}</div>
          </div>
        `;
      }
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat-message', {
        room: 'main-room',
        type: 'text',
        payload: { user: currentUser, text: text }
      });
      input.value = '';
    }

    // --- FULL MESH VOICE CALL LOGIC ---
    function renderCallUserTile(name, isMe, id) {
      const grid = document.getElementById('callGrid');
      let tile = document.getElementById(`call_tile_${id}`);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = `wa-call-tile ${isMe ? 'speaking' : ''}`;
        tile.id = `call_tile_${id}`;
        grid.appendChild(tile);
      }
      tile.innerHTML = `
        <div style="font-size: 32px;">👤</div>
        <div class="waveform"><span></span><span></span><span></span></div>
        <div class="wa-tile-name">${name} ${isMe ? '(You)' : ''}</div>
      `;
    }

    async function startGroupCall() {
      document.getElementById('callGrid').innerHTML = '';
      document.getElementById('callScreen').style.display = 'flex';
      renderCallUserTile(currentUser, true, 'local');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        startCallTimer();
        socket.emit('join-voice-call', { room: 'main-room' });
      } catch (err) {
        alert('Microphone permission required: ' + err.message);
        leaveGroupCall();
      }
    }

    socket.on('existing-callers', (callers) => {
      callers.forEach(caller => {
        renderCallUserTile(caller.username, false, caller.socketId);
        createPeerConnection(caller.socketId, caller.username, true);
      });
    });

    socket.on('webrtc-offer', async ({ fromSocketId, fromUsername, offer }) => {
      renderCallUserTile(fromUsername, false, fromSocketId);
      const pc = createPeerConnection(fromSocketId, fromUsername, false);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-answer', { targetSocketId: fromSocketId, answer });
    });

    socket.on('webrtc-answer', async ({ fromSocketId, answer }) => {
      const pc = peerConnections[fromSocketId];
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    socket.on('webrtc-ice', async ({ fromSocketId, candidate }) => {
      const pc = peerConnections[fromSocketId];
      if (pc) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    socket.on('caller-left', ({ socketId }) => {
      if (peerConnections[socketId]) {
        peerConnections[socketId].close();
        delete peerConnections[socketId];
      }
      const tile = document.getElementById(`call_tile_${socketId}`);
      if (tile) tile.remove();
      const audioEl = document.getElementById(`audio_${socketId}`);
      if (audioEl) audioEl.remove();
    });

    function createPeerConnection(targetSocketId, targetUsername, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        let audioEl = document.getElementById(`audio_${targetSocketId}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${targetSocketId}`;
          audioEl.autoplay = true;
          document.getElementById('remoteAudioContainer').appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc-ice', { targetSocketId, candidate: event.candidate });
        }
      };

      if (isInitiator) {
        pc.onnegotiationneeded = async () => {
          try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('webrtc-offer', { targetSocketId, offer });
          } catch (e) { console.error(e); }
        };
      }

      return pc;
    }

    function startCallTimer() {
      callSeconds = 0;
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function toggleMute() {
      const btn = document.getElementById('muteBtn');
      isMuted = !isMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      }
      btn.innerText = isMuted ? '🔇' : '🎤';
      btn.classList.toggle('active', isMuted);
    }

    function toggleSpeaker() {
      isSpeakerOn = !isSpeakerOn;
      const audioEls = document.querySelectorAll('#remoteAudioContainer audio');
      audioEls.forEach(el => el.muted = !isSpeakerOn);
      const btn = document.getElementById('speakerBtn');
      btn.innerText = isSpeakerOn ? '🔊' : '🔈';
      btn.classList.toggle('active', !isSpeakerOn);
    }

    function leaveGroupCall() {
      clearInterval(callTimerInterval);
      socket.emit('leave-voice-call');

      Object.keys(peerConnections).forEach(sid => {
        peerConnections[sid].close();
      });
      peerConnections = {};

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      document.getElementById('remoteAudioContainer').innerHTML = '';
      document.getElementById('callGrid').innerHTML = '';
      document.getElementById('callScreen').style.display = 'none';
    }
  </script>
</body>
</html>
