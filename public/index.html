<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drexqe Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: #0b141a; color: #e9edef; }
    
    #auth-screen { position: fixed; inset: 0; background: #0b141a; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .auth-card { background: #111b21; padding: 24px; border-radius: 16px; border: 1px solid #222d34; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .auth-card h2 { color: #00a884; text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .auth-card input, .auth-card select { width: 100%; padding: 12px 14px; background: #202c33; border: 1px solid #2a3942; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    .auth-card button { padding: 12px; background: #00a884; border: none; border-radius: 10px; color: #111b21; font-weight: 600; cursor: pointer; font-size: 15px; }

    #app-screen { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
    header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #111b21; flex-shrink: 0; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #111b21; }
    .header-info h2 { font-size: 16px; color: #e9edef; }
    .header-info p { font-size: 12px; color: #8696a0; }

    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; }
    .msg { max-width: 80%; padding: 8px 10px; border-radius: 12px; font-size: 15px; word-wrap: break-word; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; }
    .system { align-self: center; background-color: #182229; color: #8696a0; font-size: 12px; padding: 4px 10px; border-radius: 6px; }

    /* 1:1 Aspect Ratio Thumbnails */
    .media-thumb { width: 220px; height: 220px; object-fit: cover; border-radius: 8px; margin-top: 4px; cursor: pointer; display: block; }

    .input-area { display: flex; align-items: center; padding: 8px 12px; background-color: #202c33; gap: 8px; flex-shrink: 0; }
    .input-area input[type="text"] { flex: 1; background-color: #2a3942; border: none; padding: 12px 16px; border-radius: 20px; color: #e9edef; font-size: 15px; outline: none; }
    .btn-icon { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 4px; }
    .btn-send { background-color: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111b21; font-size: 16px; flex-shrink: 0; }

    /* Lightbox Modal */
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 10px; }
    #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2>Drexqe Secure</h2>
      <input type="text" id="roomIdInput" placeholder="Room ID">
      <input type="text" id="usernameInput" placeholder="Your Name">
      <select id="roleSelect" onchange="toggleSecretInput(this.value)">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <input type="password" id="passkeyInput" placeholder="Member Passkey">
      <input type="password" id="secretKeyInput" placeholder="Admin Secret Key" style="display: none;">
      <button onclick="joinRoom()">Connect</button>
    </div>
  </div>

  <div id="app-screen" style="display: none;">
    <header>
      <div class="avatar">🔒</div>
      <div class="header-info">
        <h2>Drexqe E2EE</h2>
        <p id="userRoleStatus">Encrypted Session Active</p>
      </div>
    </header>

    <div id="chat-box">
      <div class="system">End-to-end encrypted connection established.</div>
    </div>

    <div class="input-area">
      <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(this)">
      <button class="btn-icon" type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
      <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendTextMessage()">
      <button class="btn-send" onclick="sendTextMessage()">➤</button>
    </div>
  </div>

  <!-- Fullscreen Lightbox -->
  <div id="lightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="" alt="Expanded View">
  </div>

  <script>
    const socket = io();
    let cryptoKey = null;
    let currentUser = "";
    let currentRoom = "";

    function toggleSecretInput(role) {
      document.getElementById("secretKeyInput").style.display = role === "admin" ? "block" : "none";
    }

    async function deriveKey(secret) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(secret), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("drexqe-salt"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv }, cryptoKey, enc.encode(text)
      );
      return JSON.stringify({
        iv: Array.from(iv),
        ciphertext: Array.from(new Uint8Array(encrypted))
      });
    }

    async function decryptData(jsonStr) {
      try {
        const { iv, ciphertext } = JSON.parse(jsonStr);
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(iv) },
          cryptoKey,
          new Uint8Array(ciphertext)
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return jsonStr;
      }
    }

    async function joinRoom() {
      const room = document.getElementById("roomIdInput").value.trim();
      const name = document.getElementById("usernameInput").value.trim();
      const role = document.getElementById("roleSelect").value;
      const pass = document.getElementById("passkeyInput").value.trim();
      const secret = document.getElementById("secretKeyInput").value.trim();

      if (!room || !name || !pass) return alert("Fill in required fields");
      if (role === "admin" && secret !== "M4nil@l019") return alert("Invalid Admin Secret Key");
      if (pass !== "9460") return alert("Invalid Passkey");

      currentUser = name;
      currentRoom = room;
      cryptoKey = await deriveKey(pass + room);

      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "flex";
      document.getElementById("userRoleStatus").textContent = `${name} • Online`;

      socket.emit("join-room", { room, user: name });
    }

    async function sendTextMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const payload = await encryptData(JSON.stringify({ type: 'text', sender: currentUser, body: text }));
      socket.emit("chat-message", { room: currentRoom, payload });
      appendMessage({ type: 'text', sender: currentUser, body: text }, true);
      input.value = "";
    }

    async function handleMediaUpload(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) return alert("File too large! Max size 5MB.");

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target.result;
        const msgObj = {
          type: file.type.startsWith('video') ? 'video' : 'image',
          sender: currentUser,
          body: base64Data
        };
        const payload = await encryptData(JSON.stringify(msgObj));
        socket.emit("chat-message", { room: currentRoom, payload });
        appendMessage(msgObj, true);
      };
      reader.readAsDataURL(file);
      input.value = "";
    }

    socket.on("chat-message", async (data) => {
      const decryptedStr = await decryptData(data.payload);
      try {
        const parsed = JSON.parse(decryptedStr);
        if (parsed.sender !== currentUser) {
          appendMessage(parsed, false);
        }
      } catch(e) {}
    });

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    function appendMessage(msgObj, isSent) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${isSent ? 'sent' : 'received'}`;

      if (msgObj.type === 'text') {
        msgDiv.textContent = isSent ? msgObj.body : `${msgObj.sender}: ${msgObj.body}`;
      } else if (msgObj.type === 'image') {
        const img = document.createElement("img");
        img.src = msgObj.body;
        img.className = "media-thumb";
        img.onclick = () => openLightbox(msgObj.body);
        msgDiv.appendChild(img);
      } else if (msgObj.type === 'video') {
        const video = document.createElement("video");
        video.src = msgObj.body;
        video.className = "media-thumb";
        video.controls = true;
        msgDiv.appendChild(video);
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
