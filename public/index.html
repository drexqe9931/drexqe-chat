<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexqe Group Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #111b21; color: #e9edef; height: 100vh; display: flex; flex-direction: column; }
    #loginModal, #adminModal, #lightboxModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .modal-box { background: #202c33; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    .input-field { width: 100%; padding: 10px; background: #2a3942; border: none; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    .btn { padding: 10px; background: #00a884; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #ea4335; }
    .top-bar { background: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    #chatBox { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg-row { display: flex; width: 100%; margin-bottom: 4px; }
    .msg-row.me { justify-content: flex-end; }
    .msg-row.other { justify-content: flex-start; }
    .msg-row.system-row { justify-content: center; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-break: break-word; }
    .msg.me { background: #005c4b; color: #e9edef; }
    .msg.other { background: #202c33; color: #e9edef; }
    .msg.system { background: rgba(255,255,255,0.1); color: #8696a0; font-size: 12px; border-radius: 12px; padding: 4px 12px; }
    .msg-header { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; color: #00a884; gap: 10px; }
    .msg-actions { display: flex; gap: 4px; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; }
    .chat-image { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 4px; cursor: pointer; object-fit: cover; }
    .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #00a884; padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 4px; }
    #replyPreviewBar, #preSendCard, #uploadProgressContainer { background: #1f2c34; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #2a3942; font-size: 13px; }
    #uploadProgressContainer { flex-direction: column; gap: 6px; align-items: stretch; }
    .progress-bar-bg { width: 100%; background: #2a3942; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #00a884; width: 0%; transition: width 0.1s ease; }
    .bottom-bar { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
    .audio-bar { width: 3px; background: #00a884; height: 10px; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="loginModal">
    <div class="modal-box">
      <h3>Join Drexqe Chat</h3>
      <input type="text" id="usernameInput" class="input-field" placeholder="Username">
      <select id="roleSelect" class="input-field">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <input type="password" id="passkeyInput" class="input-field" placeholder="Passkey">
      <button class="btn" onclick="joinChat()">Enter Chat</button>
    </div>
  </div>

  <div class="top-bar">
    <div>
      <div style="font-weight: bold;">Drexqe Group</div>
      <div id="userInfoSub" style="font-size: 11px; color: #8696a0;">Disconnected</div>
    </div>
    <div>
      <button id="adminPanelBtn" class="btn" style="display:none; padding: 4px 8px; font-size: 12px;" onclick="openAdminModal()">Admin</button>
      <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="startGroupCall(true)">Group Call</button>
    </div>
  </div>

  <div id="chatBox"></div>

  <div id="replyPreviewBar" style="display:none;">
    <span id="replyPreviewText"></span>
    <button class="action-btn" onclick="cancelReply()">❌</button>
  </div>

  <div id="preSendCard" style="display:none;">
    <div style="display:flex; align-items:center; gap:10px;">
      <img id="preSendThumb" style="width:40px; height:40px; border-radius:4px; object-fit:cover; display:none;" />
      <div>
        <div id="preSendName" style="font-weight:bold;"></div>
        <div id="preSendSize" style="font-size:11px; color:#8696a0;"></div>
      </div>
    </div>
    <button class="action-btn" onclick="cancelPendingMediaSelection()">❌</button>
  </div>

  <div id="uploadProgressContainer" style="display:none;">
    <div style="display:flex; justify-content:space-between; font-size:12px;">
      <span id="uploadStatusText">Uploading...</span>
      <span id="uploadPercentText">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="uploadFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="bottom-bar" id="standardInputBar">
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">
    <button class="action-btn" style="font-size:20px;" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="text" id="msgInput" class="input-field" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
    <button class="action-btn" style="font-size:20px;" onclick="startVoiceRecording()">🎙️</button>
    <button class="btn" style="padding: 8px 16px;" onclick="sendChatMessage()">Send</button>
  </div>

  <script>
    const socket = io();
    let currentUser = '';
    let currentRole = 'member';
    let selectedReply = null;
    let pendingSelectedFile = null;
    let activeUploadId = null;

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function joinChat() {
      const user = document.getElementById('usernameInput').value.trim();
      const role = document.getElementById('roleSelect').value;
      const passkey = document.getElementById('passkeyInput').value.trim();
      if (!user || !passkey) return alert('Fill in all fields.');

      currentUser = user;
      currentRole = role;

      socket.emit('join-room', { room: 'main-room', user, role, passkey });
    }

    socket.on('auth-success', () => {
      document.getElementById('loginModal').style.display = 'none';
      document.getElementById('userInfoSub').innerText = `${currentUser} (${currentRole}) • Active`;
      if (currentRole === 'admin') document.getElementById('adminPanelBtn').style.display = 'inline-block';
    });

    socket.on('auth-error', alert);
    socket.on('chat-history', (history) => {
      document.getElementById('chatBox').innerHTML = '';
      history.forEach(renderMessage);
    });
    socket.on('chat-message', renderMessage);

    function renderMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const row = document.createElement('div');
      row.id = `msg_${msg.id}`;

      if (msg.type === 'system') {
        row.className = 'msg-row system-row';
        row.innerHTML = `<div class="msg system">${msg.payload.text}</div>`;
      } else {
        const isMe = msg.payload.user === currentUser;
        row.className = `msg-row ${isMe ? 'me' : 'other'}`;

        let contentHtml = '';
        if (msg.type === 'text') contentHtml = `<div>${msg.payload.text}</div>`;
        else if (msg.type === 'image') {
          contentHtml = `<img src="${msg.payload.url}" class="chat-image"><div style="font-size:10px; opacity:0.8;">${formatBytes(msg.payload.size || 0)}</div>`;
        } else if (msg.type === 'file') {
          contentHtml = `<a href="${msg.payload.url}" download="${msg.payload.name}" style="color:#00a884; font-weight:600;">📁 ${msg.payload.name} (${formatBytes(msg.payload.size || 0)})</a>`;
        }

        row.innerHTML = `
          <div class="msg ${isMe ? 'me' : 'other'}">
            <div class="msg-header"><span>${msg.payload.user}</span></div>
            ${contentHtml}
          </div>
        `;
      }
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      pendingSelectedFile = file;
      document.getElementById('preSendName').innerText = file.name;
      document.getElementById('preSendSize').innerText = formatBytes(file.size);

      const thumb = document.getElementById('preSendThumb');
      if (file.type.startsWith('image/')) {
        thumb.src = URL.createObjectURL(file);
        thumb.style.display = 'block';
      } else {
        thumb.src = '';
        thumb.style.display = 'none';
      }
      document.getElementById('preSendCard').style.display = 'flex';
    }

    function cancelPendingMediaSelection() {
      pendingSelectedFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('preSendCard').style.display = 'none';
    }

    // Accelerated 256KB Chunk Uploader with Live Progress Bar
    async function uploadFileInChunks(file) {
      const chunkSize = 256 * 1024; // 256KB chunks for maximum Socket.IO throughput
      const totalChunks = Math.ceil(file.size / chunkSize);
      const uploadId = Date.now().toString() + '_' + Math.random().toString(36).substring(2, 7);
      activeUploadId = uploadId;

      document.getElementById('uploadProgressContainer').style.display = 'flex';
      document.getElementById('uploadFill').style.width = '0%';
      document.getElementById('uploadPercentText').innerText = '0%';
      document.getElementById('uploadStatusText').innerText = `Uploading ${file.name}...`;

      socket.emit('upload-start', {
        uploadId,
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileSize: file.size,
        totalChunks,
        replyTo: selectedReply
      });

      for (let i = 0; i < totalChunks; i++) {
        if (activeUploadId !== uploadId) break;

        const start = i * chunkSize;
        const end = Math.min(file.size, start + chunkSize);
        const chunkBlob = file.slice(start, end);
        const chunkArrayBuffer = await chunkBlob.arrayBuffer();

        socket.emit('upload-chunk', { uploadId, chunkIndex: i, chunkData: chunkArrayBuffer });

        // Update UI progress dynamically
        const progress = Math.round(((i + 1) / totalChunks) * 100);
        document.getElementById('uploadFill').style.width = `${progress}%`;
        document.getElementById('uploadPercentText').innerText = `${progress}%`;
        document.getElementById('uploadStatusText').innerText = `Uploading (${formatBytes(end)} / ${formatBytes(file.size)})`;
      }
    }

    socket.on('upload-complete', ({ uploadId }) => {
      if (uploadId === activeUploadId) {
        document.getElementById('uploadProgressContainer').style.display = 'none';
        document.getElementById('uploadFill').style.width = '0%';
        activeUploadId = null;
      }
    });

    function sendChatMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();

      if (pendingSelectedFile) {
        uploadFileInChunks(pendingSelectedFile);
        cancelPendingMediaSelection();
        input.value = '';
        return;
      }

      if (!text) return;

      socket.emit('chat-message', {
        room: 'main-room',
        type: 'text',
        payload: { user: currentUser, text: text }
      });
      input.value = '';
    }
  </script>
</body>
</html>
