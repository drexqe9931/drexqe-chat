<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drexqe Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    html, body { width: 100%; height: 100%; background: #111b21; color: #e9edef; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    
    header { background: #202c33; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; flex-shrink: 0; z-index: 10; }
    .group-brand { display: flex; align-items: center; gap: 10px; }
    .group-dp { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #00a884; object-fit: cover; }
    .group-meta h3 { font-size: 16px; color: #e9edef; font-weight: 600; }
    .group-meta p { font-size: 11px; color: #8696a0; }

    #chatBox { flex: 1 1 auto; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0b141a; min-height: 0; }
    
    .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    .msg-row.system-row { align-self: center; max-width: 100%; }

    .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid #2a3942; }
    .user-avatar.admin-avatar { border: 2px solid #f39c12; box-shadow: 0 0 6px rgba(243, 156, 18, 0.5); }

    .msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word; position: relative; display: flex; flex-direction: column; cursor: pointer; width: 100%; }
    .msg.me { background: #005c4b; color: #e9edef; border-bottom-right-radius: 2px; }
    .msg.other { background: #202c33; color: #e9edef; border-bottom-left-radius: 2px; }
    .msg.system { background: #182229; color: #8696a0; font-size: 12px; font-style: italic; border-radius: 6px; cursor: default; text-align: center; padding: 4px 10px; }
    
    .msg.admin-msg { border: 1px solid #f39c12; box-shadow: 0 0 8px rgba(243, 156, 18, 0.2); }
    .admin-badge { background: linear-gradient(135deg, #f1c40f, #e67e22); color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 5px; display: inline-block; vertical-align: middle; }

    .reply-quote { background: rgba(0, 0, 0, 0.25); border-left: 4px solid #00a884; border-radius: 4px; padding: 4px 8px; margin-bottom: 6px; font-size: 12px; }
    .reply-quote .reply-author { font-weight: bold; color: #00a884; margin-bottom: 2px; }
    .reply-quote .reply-text { color: #d1d7db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #replyBar { display: none; background: #182229; padding: 8px 12px; border-left: 4px solid #00a884; justify-content: space-between; align-items: center; font-size: 13px; }
    #replyBar .reply-info { overflow: hidden; }
    #replyBar .reply-user { font-weight: bold; color: #00a884; }
    #replyBar .reply-content { color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #cancelReplyBtn { background: none; border: none; color: #8696a0; font-size: 16px; cursor: pointer; padding: 0 5px; }

    .file-card { background: #111b21; padding: 10px; border-radius: 6px; border: 1px solid #2a3942; margin-top: 5px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .file-info { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .download-link { background: #00a884; color: #111b21; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px; }

    .msg img.chat-image { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 5px; cursor: pointer; object-fit: cover; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
    .delete-btn { background: transparent; border: none; color: #8696a0; font-size: 12px; cursor: pointer; padding: 0 4px; }
    .delete-btn:hover { color: #ea0038; }
    
    footer { background: #202c33; padding: 10px; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
    .input-row { display: flex; gap: 8px; align-items: center; width: 100%; margin-top: 4px; }
    input[type="text"], input[type="password"], select { background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; outline: none; font-size: 14px; user-select: text; }
    button { background: #00a884; border: none; padding: 10px 14px; border-radius: 8px; color: #111b21; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-danger { background: #ea0038; color: #fff; }
    
    .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
    .modal-content { background: #222d34; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
    
    #imageModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); z-index: 20000; flex-direction: column; justify-content: space-between; padding: 20px; align-items: center; }
    #imageModal img { max-width: 95%; max-height: 75vh; object-fit: contain; border-radius: 8px; border: 1px solid #2a3942; }
    .img-modal-tools { display: flex; gap: 15px; margin-top: 15px; }

    .pass-container { position: relative; width: 100%; margin-bottom: 15px; }
    .pass-container input { width: 100%; padding-right: 40px; }
    .eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8696a0; cursor: pointer; font-size: 18px; padding: 0; }
    .banned-list-item { display: flex; justify-content: space-between; align-items: center; background: #111b21; padding: 8px 12px; margin: 5px 0; border-radius: 6px; font-size: 14px; }
    
    #callScreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b141a; z-index: 10000; flex-direction: column; justify-content: space-between; padding: 20px; }
    .call-header { text-align: center; padding-top: 20px; }
    .call-header h4 { color: #00a884; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .call-header h2 { font-size: 22px; margin-top: 5px; }
    .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; align-content: center; padding: 20px 0; overflow-y: auto; }
    .user-card { background: #111b21; border-radius: 16px; border: 2px solid #202c33; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .call-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #00a884; margin-bottom: 8px; }
    .user-name { font-size: 14px; font-weight: bold; }
    .call-controls { display: flex; justify-content: center; gap: 20px; padding-bottom: 30px; }
    .control-btn { width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; color: white; }
    .btn-control { background: #2a3942; }
    .btn-control.active { background: #f39c12; }
    .btn-end { background: #ea0038; transform: rotate(135deg); }
    #audioContainer { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="group-brand">
      <img src="https://api.dicebear.com/7.x/identicon/svg?seed=DrexqeGroup" class="group-dp" alt="Group Icon">
      <div class="group-meta">
        <h3>Drexqe Group</h3>
        <p>🔒 End-to-End Encrypted Secure Network</p>
      </div>
    </div>
    <div>
      <button id="voiceCallBtn" onclick="joinVoiceCall()">📞 Call</button>
      <button id="adminBtn" style="display:none;" onclick="openAdminModal()">Admin</button>
    </div>
  </header>

  <div id="chatBox"></div>
  <div id="audioContainer"></div>

  <footer>
    <div id="uploadProgressContainer" style="display:none; margin-bottom:8px; background:#111b21; padding:8px 12px; border-radius:6px; border:1px solid #2a3942;">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:#8696a0; margin-bottom:4px;">
        <span id="uploadStatusText">Uploading...</span>
        <span id="uploadPercentText">0%</span>
      </div>
      <div style="width:100%; background:#2a3942; height:6px; border-radius:3px; overflow:hidden;">
        <div id="uploadProgressBar" style="width:0%; height:100%; background:#00a884; transition:width 0.1s linear;"></div>
      </div>
    </div>

    <div id="replyBar">
      <div class="reply-info">
        Replying to <span class="reply-user" id="replyUserTarget"></span>:
        <div class="reply-content" id="replyTextTarget"></div>
      </div>
      <button id="cancelReplyBtn" onclick="clearReplyTarget()">✕</button>
    </div>
    <div class="input-row">
      <input type="file" id="mediaInput" style="display:none;" onchange="sendMediaFile(this)">
      <button type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
      <input type="text" id="msgInput" placeholder="Type a message..." style="flex:1;">
      <button id="recordBtn" onclick="toggleRecording()">🎙️</button>
      <button onclick="sendMessage()">Send</button>
    </div>
  </footer>

  <div id="imageModal">
    <div style="width:100%; display:flex; justify-content:flex-end;">
      <button onclick="closeImageModal()" style="background:#2a3942; color:#fff; border-radius:50%; width:36px; height:36px; padding:0;">✕</button>
    </div>
    <img id="modalImageView" src="" alt="Preview">
    <div class="img-modal-tools">
      <a id="downloadImgBtn" class="download-link" href="" download="image.png" style="padding:10px 20px; font-size:14px;">⬇️ Download Photo</a>
    </div>
  </div>

  <div id="callScreen">
    <div class="call-header">
      <h4>🔒 End-to-End Encrypted</h4>
      <h2>Group Voice Call</h2>
    </div>
    <div class="grid-container" id="callUsersGrid"></div>
    <div class="call-controls">
      <button class="control-btn btn-control" id="speakerBtn" onclick="toggleSpeaker()">🔊</button>
      <button class="control-btn btn-control" id="muteBtn" onclick="toggleMute()">🎙️</button>
      <button class="control-btn btn-end" onclick="leaveVoiceCall()">📞</button>
    </div>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;">Join Chat</h3>
      <input type="text" id="usernameInput" placeholder="Enter Username" style="width:100%; margin-bottom: 10px;">
      <select id="roleSelect" onchange="handleRoleChange()" style="width:100%; margin-bottom: 10px;">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <div class="pass-container">
        <input type="password" id="passkeyInput" placeholder="Enter Passkey" value="">
        <button type="button" class="eye-btn" onclick="togglePassVisibility()">👁️</button>
      </div>
      <button onclick="joinChat()" style="width:100%;">Join Room</button>
    </div>
  </div>

  <div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">Admin Panel</h3>
      
      <div style="margin-bottom:15px;">
        <input type="text" id="banUserInput" placeholder="Username to Ban" style="width:70%; display:inline-block;">
        <button class="btn-danger" style="width:28%; padding:11px;" onclick="banUser()">Ban</button>
      </div>

      <h4 style="margin: 10px 0 5px 0; text-align:left; font-size:14px; color:#8696a0;">Banned Users:</h4>
      <div id="bannedUsersList" style="max-height: 120px; overflow-y: auto; margin-bottom: 15px;"></div>

      <button class="btn-danger" style="width:100%; margin-bottom: 10px; padding: 10px;" onclick="clearAllMessages()">🗑️ Clear All Messages</button>
      <button onclick="closeAdminModal()" style="width:100%;">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ reconnection: true });
    const FIXED_ROOM = "01112011";

    let localStream = null;
    let peerConnections = {};
    let isMuted = false;
    let isSpeakerOff = false;
    let currentUser = "";
    let userRole = "member";
    let activeCallUsersList = [];
    let activeReplyTarget = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' }
      ]
    };

    function getUserAvatar(username, role) {
      if (role === 'admin') {
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
      }
      return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(username)}`;
    }

    function getDeviceId() {
      let devId = localStorage.getItem("chat_device_id");
      if (!devId) {
        devId = "dev_" + Math.random().toString(36).substring(2, 9) + "_" + Date.now();
        localStorage.setItem("chat_device_id", devId);
      }
      return devId;
    }

    window.onload = function() {
      const savedPass = localStorage.getItem("chat_passkey");
      const savedRole = localStorage.getItem("chat_role");
      const savedUser = localStorage.getItem("chat_user");

      if (savedPass && savedRole) {
        document.getElementById("passkeyInput").value = savedPass;
        document.getElementById("roleSelect").value = savedRole;
      }
      if (savedUser) {
        document.getElementById("usernameInput").value = savedUser;
      }
    };

    function handleRoleChange() {
      const role = document.getElementById("roleSelect").value;
      const savedRole = localStorage.getItem("chat_role");
      if (role === savedRole) {
        document.getElementById("passkeyInput").value = localStorage.getItem("chat_passkey") || "";
      } else {
        document.getElementById("passkeyInput").value = "";
      }
    }

    function togglePassVisibility() {
      const passInput = document.getElementById("passkeyInput");
      passInput.type = passInput.type === "password" ? "text" : "password";
    }

    function joinChat() {
      const name = document.getElementById("usernameInput").value.trim();
      const role = document.getElementById("roleSelect").value;
      const passkey = document.getElementById("passkeyInput").value.trim();

      if (!name || !passkey) return alert("Enter username and passkey!");

      currentUser = name;
      userRole = role;

      socket.emit("join-room", { 
        room: FIXED_ROOM, 
        user: name, 
        role: role, 
        passkey: passkey,
        deviceId: getDeviceId() 
      });
    }

    socket.on("auth-success", () => {
      localStorage.setItem("chat_passkey", document.getElementById("passkeyInput").value.trim());
      localStorage.setItem("chat_role", userRole);
      localStorage.setItem("chat_user", currentUser);

      document.getElementById("loginModal").style.display = "none";
      if (userRole === "admin") {
        document.getElementById("adminBtn").style.display = "inline-block";
      }
    });

    socket.on("auth-error", (msg) => alert(msg));

    socket.on("user-banned", (msg) => {
      alert(msg);
      window.location.reload();
    });

    socket.on("abuse-warning", ({ warnings, word }) => {
      alert(`⚠️ Warning ${warnings}/3: Message containing "${word}" was blocked. 3 warnings = permanent device ban.`);
    });

    socket.on("chat-history", (history) => {
      const box = document.getElementById("chatBox");
      box.innerHTML = "";
      history.forEach(msg => renderSingleMessage(msg));
      box.scrollTop = box.scrollHeight;
    });

    function setReplyTarget(sender, text) {
      activeReplyTarget = { sender, text };
      document.getElementById("replyUserTarget").textContent = sender;
      document.getElementById("replyTextTarget").textContent = text || "[Media/Attachment]";
      document.getElementById("replyBar").style.display = "flex";
      document.getElementById("msgInput").focus();
    }

    function clearReplyTarget() {
      activeReplyTarget = null;
      document.getElementById("replyBar").style.display = "none";
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
      
      const payload = { sender: currentUser, text: text };
      if (activeReplyTarget) {
        payload.replyTo = activeReplyTarget;
      }

      socket.emit("chat-message", { room: FIXED_ROOM, id: msgId, payload: payload, deviceId: getDeviceId() });
      input.value = "";
      clearReplyTarget();
    }

    function sendMediaFile(input) {
      const file = input.files[0];
      if (!file) return;

      const pContainer = document.getElementById("uploadProgressContainer");
      const pBar = document.getElementById("uploadProgressBar");
      const pPercent = document.getElementById("uploadPercentText");
      const pStatus = document.getElementById("uploadStatusText");

      pContainer.style.display = "block";
      pBar.style.width = "0%";
      pPercent.textContent = "0%";
      pStatus.textContent = `Uploading ${file.name}...`;

      const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);

      if (file.type.startsWith("image/")) {
        const img = new Image();
        const reader = new FileReader();

        reader.onprogress = function(e) {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            pBar.style.width = percent + "%";
            pPercent.textContent = percent + "%";
          }
        };

        reader.onload = function(e) {
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            const maxDimension = 1200;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedData = canvas.toDataURL("image/jpeg", 0.7);

            const payload = { 
              sender: currentUser, 
              fileData: compressedData, 
              fileName: file.name,
              fileType: "image/jpeg" 
            };
            if (activeReplyTarget) payload.replyTo = activeReplyTarget;

            socket.emit("chat-message", {
              room: FIXED_ROOM,
              id: msgId,
              type: "file",
              payload: payload,
              deviceId: getDeviceId()
            });

            setTimeout(() => { pContainer.style.display = "none"; }, 500);
            clearReplyTarget();
          };
        };
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onprogress = function(e) {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            pBar.style.width = percent + "%";
            pPercent.textContent = percent + "%";
          }
        };

        reader.onload = function(e) {
          const payload = { 
            sender: currentUser, 
            fileData: e.target.result, 
            fileName: file.name,
            fileType: file.type 
          };
          if (activeReplyTarget) payload.replyTo = activeReplyTarget;

          socket.emit("chat-message", {
            room: FIXED_ROOM,
            id: msgId,
            type: "file",
            payload: payload,
            deviceId: getDeviceId()
          });

          setTimeout(() => { pContainer.style.display = "none"; }, 500);
          clearReplyTarget();
        };
        reader.readAsDataURL(file);
      }

      input.value = "";
    }

    let mediaRecorder, audioChunks = [];
    let isRecording = false;

    function toggleRecording() {
      const btn = document.getElementById("recordBtn");
      if (!isRecording) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
              const payload = { sender: currentUser, audio: reader.result };
              if (activeReplyTarget) payload.replyTo = activeReplyTarget;

              socket.emit("chat-message", { 
                room: FIXED_ROOM, 
                id: msgId,
                type: "voice",
                payload: payload,
                deviceId: getDeviceId()
              });
              clearReplyTarget();
            };
          };
          mediaRecorder.start();
          isRecording = true;
          btn.style.background = "#ea0038";
        }).catch(err => alert("Microphone access denied: " + err.message));
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.style.background = "#00a884";
      }
    }

    function openImageModal(src) {
      const modal = document.getElementById("imageModal");
      const imgView = document.getElementById("modalImageView");
      const downloadBtn = document.getElementById("downloadImgBtn");
      
      imgView.src = src;
      downloadBtn.href = src;
      modal.style.display = "flex";
    }

    function closeImageModal() {
      document.getElementById("imageModal").style.display = "none";
    }

    function renderSingleMessage(data) {
      const box = document.getElementById("chatBox");
      const msgId = data.id || "msg_" + Date.now();
      if (document.getElementById(msgId)) return;

      const row = document.createElement("div");
      row.id = msgId;

      if (data.type === "system") {
        row.className = "msg-row system-row";
        row.innerHTML = `<div class="msg system">${data.payload.text}</div>`;
      } else {
        const isMe = data.payload.sender === currentUser;
        const isAdmin = data.role === "admin";
        
        row.className = `msg-row ${isMe ? "me" : "other"}`;

        const avatarImg = document.createElement("img");
        avatarImg.className = `user-avatar ${isAdmin ? "admin-avatar" : ""}`;
        avatarImg.src = getUserAvatar(data.payload.sender, data.role);

        const div = document.createElement("div");
        let msgClasses = ["msg", isMe ? "me" : "other"];
        if (isAdmin) msgClasses.push("admin-msg");
        div.className = msgClasses.join(" ");

        let replySnippet = "";
        if (data.payload.replyTo) {
          replySnippet = `<div class="reply-quote"><div class="reply-author">${data.payload.replyTo.sender}</div><div class="reply-text">${data.payload.replyTo.text}</div></div>`;
        }

        const canDelete = isMe || userRole === "admin";
        const deleteMarkup = canDelete ? `<button class="delete-btn" onclick="event.stopPropagation(); deleteMessage('${msgId}')">🗑️</button>` : '';
        const adminBadgeMarkup = isAdmin ? `<span class="admin-badge">👑 ADMIN</span>` : '';

        const headerHtml = `<div class="msg-header"><span><strong>${data.payload.sender}</strong>${adminBadgeMarkup}</span>${deleteMarkup}</div>`;

        let summaryText = "";
        if (data.type === "voice") {
          summaryText = "🎤 Voice Note";
          div.innerHTML = `${headerHtml}${replySnippet}<audio controls src="${data.payload.audio}"></audio>`;
        } else if (data.type === "file") {
          const isImage = data.payload.fileType && data.payload.fileType.startsWith("image/");
          if (isImage) {
            summaryText = "📷 Photo";
            div.innerHTML = `${headerHtml}${replySnippet}<img class="chat-image" src="${data.payload.fileData}" onclick="event.stopPropagation(); openImageModal(this.src)">`;
          } else {
            summaryText = `📄 ${data.payload.fileName}`;
            div.innerHTML = `${headerHtml}${replySnippet}<div class="file-card"><div class="file-info">📄 ${data.payload.fileName}</div><a class="download-link" href="${data.payload.fileData}" download="${data.payload.fileName}" onclick="event.stopPropagation()">Download</a></div>`;
          }
        } else {
          summaryText = data.payload.text || "";
          div.innerHTML = `${headerHtml}${replySnippet}<span>${data.payload.text || ''}</span>`;
        }

        let lastTap = 0;
        div.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          if (tapLength < 300 && tapLength > 0) {
            setReplyTarget(data.payload.sender, summaryText);
            e.preventDefault();
          }
          lastTap = currentTime;
        });

        row.appendChild(avatarImg);
        row.appendChild(div);
      }

      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    socket.on("chat-message", (data) => {
      renderSingleMessage(data);
    });

    function deleteMessage(msgId) {
      if (confirm("Delete this message for everyone?")) {
        socket.emit("delete-message", { room: FIXED_ROOM, msgId: msgId });
      }
    }

    socket.on("message-deleted", ({ msgId }) => {
      const msgElem = document.getElementById(msgId);
      if (msgElem) msgElem.remove();
    });

    function clearAllMessages() {
      if (confirm("Clear all messages for everyone?")) {
        socket.emit("admin-clear-all-messages", { room: FIXED_ROOM });
      }
    }

    socket.on("all-messages-cleared", () => {
      document.getElementById("chatBox").innerHTML = "";
    });

    function banUser() {
      const userToBan = document.getElementById("banUserInput").value.trim();
      if (!userToBan) return alert("Enter a username!");
      socket.emit("admin-ban-user", { room: FIXED_ROOM, username: userToBan });
      document.getElementById("banUserInput").value = "";
    }

    function unbanUser(username) {
      socket.emit("admin-unban-user", { room: FIXED_ROOM, username: username });
    }

    socket.on("update-banned-list", (list) => {
      const container = document.getElementById("bannedUsersList");
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = `<div style="font-size:12px; color:#8696a0;">No banned users</div>`;
        return;
      }
      list.forEach(u => {
        const item = document.createElement("div");
        item.className = "banned-list-item";
        item.innerHTML = `<span>${u}</span><button onclick="unbanUser('${u}')" style="padding:4px 8px; font-size:12px;">Unban</button>`;
        container.appendChild(item);
      });
    });
    async function joinVoiceCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById("callScreen").style.display = "flex";
        if (!activeCallUsersList.includes(currentUser)) {
          activeCallUsersList.push(currentUser);
        }
        renderCallGrid();
        socket.emit("voice-join", { room: FIXED_ROOM, user: currentUser });
      } catch (err) {
        alert("Microphone permission denied: " + err.message);
      }
    }

    socket.on("call-peers-list", (peers) => {
      peers.forEach(peerId => createPeerConnection(peerId, true));
    });

    socket.on("user-joined-call", ({ socketId }) => {
      createPeerConnection(socketId, false);
    });

    function createPeerConnection(targetSocketId, isInitiator) {
      if (peerConnections[targetSocketId]) return;

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        let audio = document.getElementById("audio_" + targetSocketId);
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "audio_" + targetSocketId;
          audio.autoplay = true;
          audio.playsInline = true;
          document.getElementById("audioContainer").appendChild(audio);
        }
        audio.srcObject = event.streams[0];
        audio.muted = isSpeakerOff;
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("voice-signal", { target: targetSocketId, signal: { candidate: event.candidate } });
        }
      };

      if (isInitiator) {
        pc.createOffer()
          .then(offer => pc.setLocalDescription(offer))
          .then(() => {
            socket.emit("voice-signal", { target: targetSocketId, signal: { sdp: pc.localDescription } });
          });
      }
    }

    socket.on("voice-signal", async ({ sender, signal }) => {
      let pc = peerConnections[sender];
      if (!pc) {
        createPeerConnection(sender, false);
        pc = peerConnections[sender];
      }

      if (signal.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        if (signal.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("voice-signal", { target: sender, signal: { sdp: pc.localDescription } });
        }
      } else if (signal.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
      }
    });

    socket.on("user-left-call", ({ socketId }) => {
      if (peerConnections[socketId]) {
        peerConnections[socketId].close();
        delete peerConnections[socketId];
      }
      const audio = document.getElementById("audio_" + socketId);
      if (audio) audio.remove();
    });

    function toggleMute() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById("muteBtn").classList.toggle("active", isMuted);
      }
    }

    function toggleSpeaker() {
      isSpeakerOff = !isSpeakerOff;
      const audioEls = document.querySelectorAll("#audioContainer audio");
      audioEls.forEach(a => a.muted = isSpeakerOff);
      document.getElementById("speakerBtn").classList.toggle("active", isSpeakerOff);
    }

    function leaveVoiceCall() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      Object.keys(peerConnections).forEach(id => {
        peerConnections[id].close();
        delete peerConnections[id];
      });
      document.getElementById("audioContainer").innerHTML = "";
      document.getElementById("callScreen").style.display = "none";
      socket.emit("voice-leave", { room: FIXED_ROOM });
    }

    socket.on("update-call-users", (callUsers) => {
      activeCallUsersList = callUsers;
      renderCallGrid();
    });

    function renderCallGrid() {
      const grid = document.getElementById("callUsersGrid");
      grid.innerHTML = "";
      activeCallUsersList.forEach(user => {
        const card = document.createElement("div");
        card.className = "user-card";
        const avatarUrl = getUserAvatar(user, "member");
        card.innerHTML = `<img src="${avatarUrl}" class="call-avatar" alt="${user}"><div class="user-name">${user}</div>`;
        grid.appendChild(card);
      });
    }

    function openAdminModal() { 
      document.getElementById("adminModal").style.display = "flex"; 
      socket.emit("get-banned-users");
    }
    function closeAdminModal() { document.getElementById("adminModal").style.display = "none"; }
  </script>
</body>
</html>
