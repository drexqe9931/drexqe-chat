<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexqe Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #111b21; color: #e9edef; display: flex; flex-direction: column; height: 100vh; }
    header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; }
    #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; }
    .msg.me { align-self: flex-end; background: #005c4b; color: #e9edef; }
    .msg.other { align-self: flex-start; background: #202c33; color: #e9edef; }
    footer { background: #202c33; padding: 10px; display: flex; gap: 10px; }
    input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
    button { background: #00a884; border: none; padding: 10px 20px; border-radius: 8px; color: #111b21; font-weight: bold; cursor: pointer; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: #222d34; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a3942; }
    .btn-danger { background: #ea0038; color: #fff; padding: 4px 8px; font-size: 12px; }
    .btn-warn { background: #f39c12; color: #fff; padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h3>Drexqe Chat</h3>
    <button id="adminBtn" style="display:none;" onclick="openAdminModal()">Admin Panel</button>
  </header>

  <div id="chatBox"></div>

  <footer>
    <input type="text" id="msgInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <!-- Login Modal -->
  <div id="loginModal" class="modal" style="display: flex;">
    <div class="modal-content">
      <h3>Join Chat</h3>
      <input type="text" id="usernameInput" placeholder="Enter name" style="width:100%; margin: 15px 0;">
      <button onclick="joinChat()">Join</button>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>Manage Users</h3>
      <div id="userListContainer" style="max-height: 300px; overflow-y: auto; margin: 15px 0;"></div>
      <button onclick="closeAdminModal()">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const FIXED_ROOM = "01112011";
    
    // Persistent Device ID across browser sessions & name changes
    let deviceId = localStorage.getItem("drexqe_device_id");
    if (!deviceId) {
      deviceId = "dev_" + Math.random().toString(36).substring(2, 15) + Date.now();
      localStorage.setItem("drexqe_device_id", deviceId);
    }

    let currentUser = "";
    let userRole = "member";

    function joinChat() {
      const name = document.getElementById("usernameInput").value.trim();
      if (!name) return;

      currentUser = name;
      userRole = (name.toLowerCase() === "drexqe") ? "admin" : "member";

      if (userRole === "admin") {
        document.getElementById("adminBtn").style.display = "block";
      }

      socket.emit("join-room", { room: FIXED_ROOM, user: currentUser, role: userRole, deviceId: deviceId });
      document.getElementById("loginModal").style.display = "none";
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      socket.emit("chat-message", { room: FIXED_ROOM, payload: { sender: currentUser, text: text } });
      input.value = "";
    }

    socket.on("chat-message", (data) => {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "msg " + (data.payload.sender === currentUser ? "me" : "other");
      div.innerHTML = `<strong>${data.payload.sender}:</strong> ${data.payload.text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    socket.on("warning-notice", (msg) => {
      alert(msg);
    });

    socket.on("banned-notice", (msg) => {
      alert(msg);
      window.location.reload();
    });

    socket.on("kicked-notice", () => {
      alert(" You have been kicked by the admin.");
      window.location.reload();
    });

    socket.on("update-user-list", ({ users, banned }) => {
      const container = document.getElementById("userListContainer");
      container.innerHTML = "";
      
      users.forEach(u => {
        const row = document.createElement("div");
        row.className = "user-row";
        let controls = "";
        if (userRole === 'admin' && u.username !== currentUser) {
          controls = `
            <div>
              <button class="btn-warn" onclick="kickUser('${u.id}')">Kick</button>
              <button class="btn-danger" onclick="banUser('${u.username}', '${u.id}')">Ban</button>
            </div>
          `;
        }
        row.innerHTML = `<span>${u.username} (${u.role})</span>${controls}`;
        container.appendChild(row);
      });

      if (userRole === 'admin' && banned && banned.length > 0) {
        const title = document.createElement("h4");
        title.style.color = "#ea0038";
        title.style.margin = "10px 0 5px 0";
        title.textContent = "Banned Users";
        container.appendChild(title);

        banned.forEach(bUser => {
          const bRow = document.createElement("div");
          bRow.className = "user-row";
          bRow.innerHTML = `
            <span>${bUser}</span>
            <button class="btn-warn" style="background:#00a884; color:#111b21;" onclick="unbanUser('${bUser}')">Unban</button>
          `;
          container.appendChild(bRow);
        });
      }
    });

    function kickUser(id) {
      socket.emit("admin-kick-user", { targetSocketId: id });
    }

    function banUser(username, id) {
      if (confirm(`Ban ${username}?`)) {
        socket.emit("admin-ban-user", { username: username, targetSocketId: id });
      }
    }

    function unbanUser(username) {
      if (confirm(`Unban ${username}?`)) {
        socket.emit("admin-unban-user", { username: username });
      }
    }

    function openAdminModal() { document.getElementById("adminModal").style.display = "flex"; }
    function closeAdminModal() { document.getElementById("adminModal").style.display = "none"; }
  </script>
</body>
</html>
