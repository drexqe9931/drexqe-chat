<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drexqe Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body { width: 100%; height: 100%; background: #111b21; color: #e9edef; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    
    header { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; flex-shrink: 0; z-index: 10; }
    
    #chatBox { flex: 1 1 auto; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0b141a; min-height: 0; }
    
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; position: relative; display: flex; flex-direction: column; }
    .msg.me { align-self: flex-end; background: #005c4b; color: #e9edef; }
    .msg.other { align-self: flex-start; background: #202c33; color: #e9edef; }
    .msg.system { align-self: center; background: #182229; color: #8696a0; font-size: 12px; font-style: italic; border-radius: 6px; }
    .msg img { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 5px; cursor: pointer; }
    
    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
    .delete-btn { background: transparent; border: none; color: #8696a0; font-size: 12px; cursor: pointer; padding: 0 4px; }
    .delete-btn:hover { color: #ea0038; }

    footer { background: #202c33; padding: 10px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; z-index: 10; }
    input[type="text"], input[type="password"], select { background: #2a3942; border: none; padding: 12px; border-radius: 8px; color: #fff; outline: none; font-size: 14px; }
    button { background: #00a884; border: none; padding: 10px 14px; border-radius: 8px; color: #111b21; font-weight: bold; cursor: pointer; font-size: 14px; }
    
    .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
    .modal-content { background: #222d34; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
    
    #callScreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b141a; z-index: 10000; flex-direction: column; justify-content: space-between; padding: 20px; }
    .call-header { text-align: center; padding-top: 20px; }
    .call-header h4 { color: #00a884; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .call-header h2 { font-size: 22px; margin-top: 5px; }
    
    .grid-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; align-content: center; padding: 20px 0; overflow-y: auto; }
    .user-card { background: #111b21; border-radius: 16px; border: 2px solid #202c33; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .user-card.speaking { border-color: #00a884; box-shadow: 0 0 12px rgba(0, 168, 132, 0.4); }
    .avatar { width: 60px; height: 60px; background: #6b7c85; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .user-name { font-size: 14px; font-weight: bold; }
    
    .call-controls { display: flex; justify-content: center; gap: 20px; padding-bottom: 30px; }
    .control-btn { width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; color: white; }
    .btn-control { background: #2a3942; }
    .btn-control.active { background: #f39c12; }
    .btn-end { background: #ea0038; transform: rotate(135deg); }

    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a3942; }
    .btn-danger { background: #ea0038; color: #fff; padding: 4px 8px; font-size: 12px; }
    .btn-warn { background: #f39c12; color: #fff; padding: 4px 8px; font-size: 12px; }
    #audioContainer { display: none; }
  </style>
</head>
<body>

  <header>
    <h3>Drexqe Chat</h3>
    <div>
      <button id="voiceCallBtn" onclick="joinVoiceCall()">📞 Voice Call</button>
      <button id="adminBtn" style="display:none;" onclick="openAdminModal()">Admin Panel</button>
    </div>
  </header>

  <div id="chatBox"></div>
  <div id="audioContainer"></div>

  <footer>
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" onchange="sendMediaFile(this)">
    <button type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
    <input type="text" id="msgInput" placeholder="Type a message..." style="flex:1;">
    <button id="recordBtn" onclick="toggleRecording()">🎙️</button>
    <button onclick="sendMessage()">Send</button>
  </footer>

  <!-- Call Modal Screen -->
  <div id="callScreen">
    <div class="call-header">
      <h4>🔒 End-to-End Encrypted</h4>
      <h2>Group Voice Call</h2>
    </div>

    <div class="grid-container" id="callUsersGrid"></div>

    <div class="call-controls">
      <button class="control-btn btn-control" id="speakerBtn" onclick="toggleSpeaker()">🔊</button>
      <button class="control-btn btn-control" id="muteBtn" onclick="toggleMute()">🎙️</button>
      <button class="control-btn btn-end" onclick="leaveVoiceCall()">📞</button>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;">Join Chat</h3>
      <input type="text" id="usernameInput" placeholder="Enter Username" style="width:100%; margin-bottom: 10px;">
      <select id="roleSelect" style="width:100%; margin-bottom: 10px;">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <input type="password" id="passkeyInput" placeholder="Enter Passkey" style="width:100%; margin-bottom: 15px;">
      <button onclick="joinChat()" style="width:100%;">Join Room</button>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Manage Users</h3>
      <button class="btn-danger" style="width:100%; margin: 10px 0; padding: 8px;" onclick="clearAllMessages()">🗑️ Clear All Messages</button>
      <div id="userListContainer" style="max-height: 250px; overflow-y: auto; margin: 10px 0;"></div>
      <button onclick="closeAdminModal()">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = typeof io !== 'undefined' ? io({ reconnection: true, reconnectionAttempts: 10 }) : null;
    const FIXED_ROOM = "01112011";
    
    let localStream = null;
    let peerConnections = {};
    let isMuted = false;
    let isSpeakerOff = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' }
      ]
    };

    let deviceId = localStorage.getItem("drexqe_device_id");
    if (!deviceId) {
      deviceId = "dev_" + Math.random().toString(36).substring(2, 15) + Date.now();
      localStorage.setItem("drexqe_device_id", deviceId);
    }

    let currentUser = "";
    let userRole = "member";
    let activeCallUsersList = [];

    function initUI() {
      const modal = document.getElementById("loginModal");
      if (modal) modal.style.display = "flex";

      const savedUser = localStorage.getItem("drexqe_user");
      const savedRole = localStorage.getItem("drexqe_role");
      const savedPasskey = localStorage.getItem("drexqe_passkey");

      if (savedUser && document.getElementById("usernameInput")) document.getElementById("usernameInput").value = savedUser;
      if (savedRole && document.getElementById("roleSelect")) document.getElementById("roleSelect").value = savedRole;
      if (savedPasskey && document.getElementById("passkeyInput")) document.getElementById("passkeyInput").value = savedPasskey;
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initUI);
    } else {
      initUI();
    }

    function joinChat() {
      const name = document.getElementById("usernameInput").value.trim();
      const role = document.getElementById("roleSelect").value;
      const passkey = document.getElementById("passkeyInput").value.trim();

      if (!name || !passkey) return alert("Enter username and passkey!");

      currentUser = name;
      userRole = role;

      localStorage.setItem("drexqe_user", name);
      localStorage.setItem("drexqe_role", role);
      localStorage.setItem("drexqe_passkey", passkey);

      if (socket) {
        socket.emit("join-room", { 
          room: FIXED_ROOM, 
          user: currentUser, 
          role: userRole, 
          passkey: passkey, 
          deviceId: deviceId
        });
      }
    }

    if (socket) {
      socket.on("connect", () => {
        const savedUser = localStorage.getItem("drexqe_user");
        const savedPasskey = localStorage.getItem("drexqe_passkey");
        if (savedUser && savedPasskey) {
          socket.emit("join-room", {
            room: FIXED_ROOM,
            user: savedUser,
            role: localStorage.getItem("drexqe_role") || "member",
            passkey: savedPasskey,
            deviceId: deviceId
          });
        }
      });

      socket.on("auth-success", () => {
        document.getElementById("loginModal").style.display = "none";
        if (userRole === "admin") document.getElementById("adminBtn").style.display = "inline-block";
      });

      socket.on("auth-error", (msg) => alert(msg));
      socket.on("pending-approval-notice", (msg) => alert(msg));
      socket.on("approval-granted", () => {
        alert("✅ Request approved by Admin!");
        document.getElementById("loginModal").style.display = "none";
      });
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);

      if (socket) socket.emit("chat-message", { room: FIXED_ROOM, id: msgId, payload: { sender: currentUser, text: text } });
      input.value = "";
    }

    function sendMediaFile(input) {
      const file = input.files[0];
      if (!file) return;

      const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
      const reader = new FileReader();
      reader.onload = function(e) {
        if (socket) {
          socket.emit("chat-message", {
            room: FIXED_ROOM,
            id: msgId,
            type: file.type.startsWith("video/") ? "video" : "image",
            payload: { sender: currentUser, media: e.target.result }
          });
        }
      };
      reader.readAsDataURL(file);
      input.value = "";
    }

    let mediaRecorder, audioChunks = [];
    let isRecording = false;

    function toggleRecording() {
      const btn = document.getElementById("recordBtn");
      if (!isRecording) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
              if (socket) {
                socket.emit("chat-message", { 
                  room: FIXED_ROOM, 
                  id: msgId,
                  type: "voice",
                  payload: { sender: currentUser, audio: reader.result } 
                });
              }
            };
          };
          mediaRecorder.start();
          isRecording = true;
          btn.style.background = "#ea0038";
        }).catch(err => alert("Microphone access denied: " + err.message));
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.style.background = "#00a884";
      }
    }

    if (socket) {
      socket.on("chat-message", (data) => {
        const box = document.getElementById("chatBox");
        if (!box) return;

        const msgId = data.id || "msg_" + Date.now();
        if (document.getElementById(msgId)) return;

        const div = document.createElement("div");
        div.id = msgId;

        if (data.type === "system") {
          div.className = "msg system";
          div.textContent = data.payload.text;
        } else {
          const isMe = data.payload.sender === currentUser;
          div.className = "msg " + (isMe ? "me" : "other");

          const canDelete = isMe || userRole === "admin";
          const deleteMarkup = canDelete ? `<button class="delete-btn" onclick="deleteMessage('${msgId}', '${data.payload.sender}')">🗑️</button>` : '';

          const headerHtml = `
            <div class="msg-header">
              <strong>${data.payload.sender}</strong>
              ${deleteMarkup}
            </div>
          `;

          if (data.type === "voice") {
            div.innerHTML = `${headerHtml}<audio controls src="${data.payload.audio}"></audio>`;
          } else if (data.type === "image") {
            div.innerHTML = `${headerHtml}<img src="${data.payload.media}" onclick="window.open(this.src)">`;
          } else if (data.type === "video") {
            div.innerHTML = `${headerHtml}<video controls style="max-width:100%; border-radius:6px;" src="${data.payload.media}"></video>`;
          } else {
            div.innerHTML = `${headerHtml}<span>${data.payload.text || ''}</span>`;
          }
        }

        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      });
    }

    function deleteMessage(msgId, sender) {
      if (confirm("Delete this message for everyone?")) {
        if (socket) socket.emit("delete-message", { room: FIXED_ROOM, msgId: msgId, sender: sender });
      }
    }

    if (socket) {
      socket.on("message-deleted", ({ msgId }) => {
        const msgElem = document.getElementById(msgId);
        if (msgElem) msgElem.remove();
      });
    }

    function clearAllMessages() {
      if (confirm("Clear all messages for everyone in the chat?")) {
        if (socket) socket.emit("admin-clear-all-messages", { room: FIXED_ROOM });
      }
    }

    if (socket) {
      socket.on("all-messages-cleared", () => {
        document.getElementById("chatBox").innerHTML = "";
      });
    }

    async function joinVoiceCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById("callScreen").style.display = "flex";
        if (!activeCallUsersList.includes(currentUser)) {
          activeCallUsersList.push(currentUser);
        }
        renderCallGrid();
        if (socket) socket.emit("voice-join", { room: FIXED_ROOM, user: currentUser });
      } catch (err) {
        alert("Microphone permission check failed: " + err.message);
      }
    }

    if (socket) {
      socket.on("call-peers-list", (peers) => {
        peers.forEach(peerId => createPeerConnection(peerId, true));
      });

      socket.on("user-joined-call", ({ socketId }) => {
        createPeerConnection(socketId, false);
      });
    }

    function createPeerConnection(targetSocketId, isInitiator) {
      if (peerConnections[targetSocketId]) return;

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        let audio = document.getElementById("audio_" + targetSocketId);
        if (!audio) {
          audio = document.createElement("audio");
          audio.id = "audio_" + targetSocketId;
          audio.autoplay = true;
          audio.playsInline = true;
          document.getElementById("audioContainer").appendChild(audio);
        }
        audio.srcObject = event.streams[0];
        audio.muted = isSpeakerOff;
        audio.play().catch(e => console.log("Autoplay unblock required:", e));
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && socket) {
          socket.emit("voice-signal", { target: targetSocketId, signal: { candidate: event.candidate } });
        }
      };

      if (isInitiator) {
        pc.createOffer({ offerToReceiveAudio: true })
          .then(offer => pc.setLocalDescription(offer))
          .then(() => {
            if (socket) socket.emit("voice-signal", { target: targetSocketId, signal: { sdp: pc.localDescription } });
          })
          .catch(err => console.error("Offer Creation Error:", err));
      }
    }

    if (socket) {
      socket.on("voice-signal", async ({ sender, signal }) => {
        let pc = peerConnections[sender];
        if (!pc) {
          createPeerConnection(sender, false);
          pc = peerConnections[sender];
        }

        try {
          if (signal.sdp) {
            await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            if (signal.sdp.type === 'offer') {
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              socket.emit("voice-signal", { target: sender, signal: { sdp: pc.localDescription } });
            }
          } else if (signal.candidate) {
            await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
          }
        } catch (err) {
          console.error("Signaling Process Failure:", err);
        }
      });

      socket.on("user-left-call", ({ socketId }) => {
        if (peerConnections[socketId]) {
          peerConnections[socketId].close();
          delete peerConnections[socketId];
        }
        const audio = document.getElementById("audio_" + socketId);
        if (audio) audio.remove();
      });
    }

    function toggleMute() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        const btn = document.getElementById("muteBtn");
        if (isMuted) {
          btn.classList.add("active");
          btn.textContent = "🔇";
        } else {
          btn.classList.remove("active");
          btn.textContent = "🎙️";
        }
      }
    }

    function toggleSpeaker() {
      isSpeakerOff = !isSpeakerOff;
      const btn = document.getElementById("speakerBtn");
      const audioEls = document.querySelectorAll("#audioContainer audio");
      audioEls.forEach(a => a.muted = isSpeakerOff);

      if (isSpeakerOff) {
        btn.classList.add("active");
        btn.textContent = "🔈";
      } else {
        btn.classList.remove("active");
        btn.textContent = "🔊";
      }
    }

    function leaveVoiceCall() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      Object.keys(peerConnections).forEach(id => {
        peerConnections[id].close();
        delete peerConnections[id];
      });
      document.getElementById("audioContainer").innerHTML = "";
      document.getElementById("callScreen").style.display = "none";
      if (socket) socket.emit("voice-leave", { room: FIXED_ROOM });
    }

    if (socket) {
      socket.on("update-call-users", (callUsers) => {
        activeCallUsersList = callUsers;
        renderCallGrid();
      });
    }

    function renderCallGrid() {
      const grid = document.getElementById("callUsersGrid");
      if (!grid) return;
      grid.innerHTML = "";

      activeCallUsersList.forEach(user => {
        const card = document.createElement("div");
        card.className = "user-card speaking";
        
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = user ? user.charAt(0).toUpperCase() : "?";

        const name = document.createElement("div");
        name.className = "user-name";
        name.textContent = user === currentUser ? `${user} (You)` : user;

        card.appendChild(avatar);
        card.appendChild(name);
        grid.appendChild(card);
      });
    }

    if (socket) {
      socket.on("warning-notice", (msg) => alert(msg));
      socket.on("banned-notice", (msg) => { alert(msg); window.location.reload(); });
      socket.on("kicked-notice", () => { alert("You were kicked!"); window.location.reload(); });

      socket.on("admin-join-request", ({ username }) => {
        if (userRole === "admin") {
          alert(`🔒 Banned user "${username}" is attempting to join. Open Admin Panel to approve.`);
        }
      });

      socket.on("update-user-list", ({ users, banned, requests }) => {
        const container = document.getElementById("userListContainer");
        if (!container) return;
        container.innerHTML = "";

        const uTitle = document.createElement("h4");
        uTitle.textContent = "Online Users";
        container.appendChild(uTitle);

        users.forEach(u => {
          const row = document.createElement("div");
          row.className = "user-row";
          let controls = "";
          if (userRole === 'admin' && u.username !== currentUser) {
            controls = `
              <div>
                <button class="btn-warn" onclick="kickUser('${u.id}')">Kick</button>
                <button class="btn-danger" onclick="banUser('${u.username}', '${u.id}')">Ban</button>
              </div>
            `;
          }
          row.innerHTML = `<span>${u.username} (${u.role})</span>${controls}`;
          container.appendChild(row);
        });

        if (userRole === 'admin' && requests && requests.length > 0) {
          const rTitle = document.createElement("h4");
          rTitle.style.color = "#f39c12";
          rTitle.style.marginTop = "10px";
          rTitle.textContent = "Unban Requests";
          container.appendChild(rTitle);

          requests.forEach(r => {
            const rRow = document.createElement("div");
            rRow.className = "user-row";
            rRow.innerHTML = `
              <span>${r.username}</span>
              <div>
                <button class="btn-warn" style="background:#00a884; color:#111b21;" onclick="approveJoin('${r.socketId}')">Approve</button>
                <button class="btn-danger" onclick="denyJoin('${r.socketId}')">Deny</button>
              </div>
            `;
            container.appendChild(rRow);
          });
        }

        if (userRole === 'admin' && banned && banned.length > 0) {
          const bTitle = document.createElement("h4");
          bTitle.style.color = "#ea0038";
          bTitle.style.marginTop = "10px";
          bTitle.textContent = "Banned Users";
          container.appendChild(bTitle);

          banned.forEach(bUser => {
            const bRow = document.createElement("div");
            bRow.className = "user-row";
            bRow.innerHTML = `
              <span>${bUser}</span>
              <button class="btn-warn" style="background:#00a884; color:#111b21;" onclick="unbanUser('${bUser}')">Unban</button>
            `;
            container.appendChild(bRow);
          });
        }
      });
    }

    function kickUser(id) { if (socket) socket.emit("admin-kick-user", { targetSocketId: id }); }
    function banUser(username, id) { if (confirm(`Ban ${username}?`) && socket) socket.emit("admin-ban-user", { username, targetSocketId: id }); }
    function unbanUser(username) { if (confirm(`Unban ${username}?`) && socket) socket.emit("admin-unban-user", { username }); }
    function approveJoin(id) { if (socket) socket.emit("admin-approve-join", { targetSocketId: id }); }
    function denyJoin(id) { if (socket) socket.emit("admin-deny-join", { targetSocketId: id }); }

    function openAdminModal() { document.getElementById("adminModal").style.display = "flex"; }
    function closeAdminModal() { document.getElementById("adminModal").style.display = "none"; }
  </script>
</body>
</html>
