<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexqe Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #111b21; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #111b21; }
    .header-info h2 { font-size: 16px; color: #e9edef; }
    .header-info p { font-size: 12px; color: #8696a0; }

    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 16px 16px; }
    
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .received { background-color: #202c33; align-self: flex-start; }
    .sent { background-color: #005c4b; align-self: flex-end; }
    .system { align-self: center; background-color: #182229; color: #8696a0; font-size: 12px; padding: 5px 10px; border-radius: 6px; }
    
    .input-area { display: flex; align-items: center; padding: 10px; background-color: #202c33; gap: 8px; }
    .input-area input[type="text"] { flex: 1; background-color: #2a3942; border: none; padding: 12px 16px; border-radius: 8px; color: #e9edef; font-size: 15px; outline: none; }
    
    .btn-icon { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 0 6px; }
    .btn-send { background-color: #00a884; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111b21; font-size: 18px; }
    
    img, video { max-width: 100%; border-radius: 6px; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <div class="avatar">🔒</div>
    <div class="header-info">
      <h2>Drexqe</h2>
      <p>online • E2EE Encrypted</p>
    </div>
  </header>

  <div id="chat-box">
    <div class="system">Welcome to Drexqe E2EE Chat</div>
  </div>

  <div class="input-area">
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(this)">
    <button class="btn-icon" type="button" onclick="document.getElementById('mediaInput').click()">📎</button>
    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn-send" onclick="sendMessage()">➤</button>
  </div>

  <script>
    const socket = io();

    async function handleMediaUpload(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert("File too large! Select a file under 5MB.");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target.result;
        const payload = JSON.stringify({
          type: file.type.startsWith('video') ? 'video' : 'image',
          data: base64Data
        });
        socket.emit("chat-message", { payload });
      };
      reader.readAsDataURL(file);
    }

    socket.on("chat-message", (data) => {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg received";

      try {
        const parsed = JSON.parse(data.payload);
        if (parsed.type === 'image') {
          const img = document.createElement("img");
          img.src = parsed.data;
          msgDiv.appendChild(img);
        } else if (parsed.type === 'video') {
          const video = document.createElement("video");
          video.src = parsed.data;
          video.controls = true;
          msgDiv.appendChild(video);
        }
      } catch (e) {
        msgDiv.textContent = data.payload;
      }
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendMessage() {
      const input = document.getElementById("msgInput");
      if (!input.value.trim()) return;
      socket.emit("chat-message", { payload: input.value });
      
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg sent";
      msgDiv.textContent = input.value;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      input.value = "";
    }
  </script>
</body>
</html>
